<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Inventario</title>
<link rel="stylesheet" href="estilo.css">
</head>

<body>
    <header class="top-header">
    <div class="logo-name">Deportes Zambrano</div>
    <div class="header-icons">
        <span class="icon search-icon">&#128269;</span>
        <span class="icon burger-menu">&#9776;</span>
    </div>
</header>

<div class="container">

<div class="sidebar">
<h2>Inventario</h2>
<a href="dashboard.html">Inicio</a>
<a href="productos.html">Inventario</a>
<a href="usuario.html">Usuario</a>
<form action="index.html">
    <button id="btn-logout" type="submit">Cerrar sesión</button>
</form>
</div>

<div class="main">

<h1>Inventario</h1>

<div class="card">

<table id="productos-table" width="100%" border="1" cellspacing="0" cellpadding="10">
<thead>
<tr>
<th>Producto</th>
<th>Cantidad</th>
<th>Precio</th>
<th>Categoria</th>
<th>Acciones</th>
</tr>
</thead>
<tbody id="productos-body">
<!-- Productos se cargarán aquí dinámicamente -->
</tbody>
<tfoot>
<tr>
<td><input type="text" id="nuevo-nombre" placeholder="Nuevo producto"></td>
<td><input type="number" id="nuevo-stock" placeholder="Cantidad"></td>
<td><input type="number" id="nuevo-precio" placeholder="Precio"></td>
<td><input type="text" id="nuevo-categoria" placeholder="Categoria"></td>
<td>
<button id="btn-agregar">Agregar</button>
</td>
</tr>
</tfoot>
</table>

</div>

</div>

</div>

<script src="productos.js"></script>

</body>
</html>
